_format_version: "3.0"
_transform: true

services:
  - name: codestra-lead-intake
    url: http://codestra-lead-adapter:8080
    protocol: http
    connect_timeout: 5000
    read_timeout: 15000
    write_timeout: 15000
    retries: 0
    routes:
      - name: codestra-lead-intake-v1
        paths:
          - /api/leads/v1/consultations
        methods:
          - POST
          - OPTIONS
        protocols:
          - https
        strip_path: false
        preserve_host: false
        https_redirect_status_code: 308
        request_buffering: true
        response_buffering: true
        plugins:
          - name: cors
            config:
              origins:
                - https://codestra.co
                - https://www.codestra.co
              methods:
                - POST
                - OPTIONS
              headers:
                - Accept
                - Content-Type
                - Idempotency-Key
                - X-Codestra-Form-Version
              exposed_headers:
                - X-Correlation-ID
                - Retry-After
              credentials: false
              max_age: 600
              preflight_continue: false
          - name: request-size-limiting
            config:
              allowed_payload_size: 128
              size_unit: kilobytes
              require_content_length: false
          - name: rate-limiting
            config:
              second: 2
              minute: 12
              hour: 60
              policy: local
              fault_tolerant: false
              hide_client_headers: false
          - name: correlation-id
            config:
              header_name: X-Correlation-ID
              generator: uuid#counter
              echo_downstream: true

plugins:
  - name: prometheus
    config:
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
      upstream_health_metrics: true
      per_consumer: false
