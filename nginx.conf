# Original request URI is retained across SPA internal redirects to index.html.
# Third-party scripts are allowed only on the public chat page allowlist.
map $request_uri $codestra_chat_script_src {
    default "";
    ~^/(about|case-studies|contact(/sales|/support)?|services|privacy|terms)?/?(\?.*)?$ "https://widgets.leadconnectorhq.com https://stcdn.leadconnectorhq.com https://services.leadconnectorhq.com/appengine/cors/js/user-session.js";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; script-src 'self' $codestra_chat_script_src; style-src 'self' 'unsafe-inline' https://widgets.leadconnectorhq.com https://stcdn.leadconnectorhq.com; img-src 'self' data: https:; font-src 'self' data: https://widgets.leadconnectorhq.com; frame-src 'self' https://widgets.leadconnectorhq.com; connect-src 'self' https: wss:; upgrade-insecure-requests" always;

    # Serve complete policy text before JavaScript and support common legal URLs.
    location = /privacy { try_files /privacy/index.html =404; expires -1; }
    location = /terms { try_files /terms/index.html =404; expires -1; }
    location = /privacy/index.html { return 308 /privacy; }
    location = /terms/index.html { return 308 /terms; }
    location ~ ^/privacy-policy/?$ { return 308 /privacy; }
    location ~ ^/(terms-and-conditions|terms-of-service)/?$ { return 308 /terms; }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        # Inherit the server security headers; expires sets cache policy.
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
