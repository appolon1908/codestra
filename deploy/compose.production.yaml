name: ${COMPOSE_PROJECT_NAME:?set COMPOSE_PROJECT_NAME}

services:
  web:
    image: ${IMAGE_REF:?set immutable IMAGE_REF with @sha256 digest}
    user: "101:101"
    restart: unless-stopped
    init: true
    read_only: true
    pull_policy: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    pids_limit: 128
    cpus: 1.0
    mem_limit: 256m
    stop_grace_period: 20s
    ports:
      - "127.0.0.1:${WEB_PORT:?set WEB_PORT}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    labels:
      org.opencontainers.image.revision: ${RELEASE_SHA:?set RELEASE_SHA}
      codestra.release.image: ${IMAGE_REF}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - codestra_web

networks:
  codestra_web:
    driver: bridge
