# Original request URI is retained across SPA internal redirects to index.html.
# Third-party scripts are allowed only on the public chat page allowlist.
map $request_uri $codestra_chat_script_src {
    default "";
    ~^/(about|case-studies|contact(/sales|/support)?|services|privacy|terms|sms|sms-terms|contact-information)?/?(\?.*)?$ "https://widgets.leadconnectorhq.com https://stcdn.leadconnectorhq.com https://services.leadconnectorhq.com/appengine/cors/js/user-session.js";
}

# Trust only the verified Caddy connection peer for HTTPS metadata.
map "$remote_addr:$http_x_forwarded_proto" $codestra_forwarded_proto {
    default $scheme;
    "10.0.0.73:https" https;
}
map "$remote_addr:$http_x_real_ip" $codestra_client_ip {
    default $remote_addr;
    ~^10\.0\.0\.73:(?<codestra_edge_client_ip>[0-9a-fA-F:.]+)$ $codestra_edge_client_ip;
}
server {
    listen 8080;
    server_name _;
    # Preserve the external HTTPS scheme and mapped port behind the TLS edge.
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 20m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; script-src 'self' $codestra_chat_script_src; style-src 'self' 'unsafe-inline' https://widgets.leadconnectorhq.com https://stcdn.leadconnectorhq.com; img-src 'self' data: https:; font-src 'self' data: https://widgets.leadconnectorhq.com; frame-src 'self' https://widgets.leadconnectorhq.com; connect-src 'self' https: wss:" always;
    proxy_hide_header X-Content-Type-Options;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $codestra_client_ip;
    proxy_set_header X-Forwarded-For $codestra_client_ip;
    proxy_set_header X-Forwarded-Proto $codestra_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    # Serve complete policy text before JavaScript and support common legal URLs.
    location ~ ^/(sms|sms-terms|contact-information)/?$ { try_files /$1/index.html =404; expires -1; }
    location ~ ^/(sms|sms-terms|contact-information)/index.html$ { return 308 /$1; }
    location = /privacy { try_files /privacy/index.html =404; expires -1; }
    location = /terms { try_files /terms/index.html =404; expires -1; }
    location = /privacy/index.html { return 308 /privacy; }
    location = /terms/index.html { return 308 /terms; }
    location ~ ^/privacy-policy/?$ { return 308 /privacy; }
    location ~ ^/(terms-and-conditions|terms-of-service)/?$ { return 308 /terms; }

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location ~ ^/(api/|admin/|static/) { proxy_pass $backend$request_uri; }
    location = /healthz/ { proxy_pass $backend$request_uri; }
    location = /sitemap.xml { proxy_pass $backend$request_uri; }
    location = /admin { return 302 /admin/; }
    location ^~ /media/tax/images/ { proxy_pass $backend$request_uri; }
    location ^~ /media/career/ { proxy_pass $backend$request_uri; }
    location /media/ { alias /srv/media/; autoindex off; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location / { try_files $uri $uri/ /index.html; expires -1; }
}
