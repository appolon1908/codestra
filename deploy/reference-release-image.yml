name: Release immutable image

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character SHA already merged into main
        required: true
        type: string
      publish:
        description: Publish the verified image to GHCR
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-image-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.verify.outputs.source_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: verify
        name: Verify protected source identity
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "Release workflow must be dispatched from main." >&2
            exit 1
          }
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || {
            echo "source_sha must be a full lowercase SHA." >&2
            exit 1
          }
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          resolved="$(git rev-parse "${SOURCE_SHA}^{commit}")"
          [[ "$resolved" == "$SOURCE_SHA" ]] || exit 1
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          [[ "$(git rev-parse origin/main)" == "$SOURCE_SHA" ]] || {
            echo "Only the exact current main head may be released." >&2
            exit 1
          }
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  build:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      SOURCE_SHA: ${{ needs.source.outputs.source_sha }}
      VITE_API_ENDPOINT: ${{ vars.VITE_API_ENDPOINT }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm

      - name: Validate public build endpoint
        run: |
          set -Eeuo pipefail
          [[ "$VITE_API_ENDPOINT" =~ ^https://[A-Za-z0-9.-]+(:[0-9]{2,5})?(/.*)?$ ]] || {
            echo "VITE_API_ENDPOINT must be a public HTTPS URL." >&2
            exit 1
          }

      - run: npm ci
      - run: npm run verify

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - id: image
        name: Set image identity
        run: |
          set -Eeuo pipefail
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          image_tag="${image_name}:sha-${SOURCE_SHA:0:12}"
          echo "name=$image_name" >> "$GITHUB_OUTPUT"
          echo "tag=$image_tag" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: ${{ inputs.publish }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: local_build
        name: Build local verification image
        if: ${{ inputs.publish == false }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.image.outputs.tag }}
          build-args: VITE_API_ENDPOINT=${{ env.VITE_API_ENDPOINT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - id: publish_build
        name: Build and publish image with BuildKit provenance
        if: ${{ inputs.publish }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.tag }}
          build-args: VITE_API_ENDPOINT=${{ env.VITE_API_ENDPOINT }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - id: scan_target
        name: Resolve exact scan target
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          PUBLISHED_DIGEST: ${{ steps.publish_build.outputs.digest }}
        run: |
          set -Eeuo pipefail
          if [[ "${{ inputs.publish }}" == "true" ]]; then
            [[ "$PUBLISHED_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || {
              echo "Build did not return an immutable digest." >&2
              exit 1
            }
            image_ref="${IMAGE_NAME}@${PUBLISHED_DIGEST}"
          else
            image_ref="$IMAGE_TAG"
          fi
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.scan_target.outputs.image_ref }}
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: "0"

      - name: Generate vulnerability evidence
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.scan_target.outputs.image_ref }}
          format: json
          output: release-scan.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Enforce vulnerability gate
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.scan_target.outputs.image_ref }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Install Cosign
        if: ${{ inputs.publish }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6

      - name: Sign immutable image with GitHub OIDC
        if: ${{ inputs.publish }}
        env:
          IMAGE_REF: ${{ steps.scan_target.outputs.image_ref }}
        run: cosign sign --yes "$IMAGE_REF"

      - name: Verify image signature and workflow identity
        if: ${{ inputs.publish }}
        env:
          IMAGE_REF: ${{ steps.scan_target.outputs.image_ref }}
          SIGNATURE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release-image.yml@refs/heads/main
          SIGNATURE_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -Eeuo pipefail
          cosign verify \
            --certificate-identity "$SIGNATURE_IDENTITY" \
            --certificate-oidc-issuer "$SIGNATURE_ISSUER" \
            "$IMAGE_REF" > cosign-verification.json
          test -s cosign-verification.json

      - name: Write signed release tuple
        if: ${{ inputs.publish }}
        env:
          IMAGE_REF: ${{ steps.scan_target.outputs.image_ref }}
          SIGNATURE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release-image.yml@refs/heads/main
          SIGNATURE_ISSUER: https://token.actions.githubusercontent.com
          PROVENANCE_MODE: buildkit-max
        run: |
          set -Eeuo pipefail
          export SBOM_SHA256="$(sha256sum sbom.cdx.json | awk '{print $1}')"
          export SCAN_SHA256="$(sha256sum release-scan.json | awk '{print $1}')"
          export COSIGN_VERIFICATION_SHA256="$(
            sha256sum cosign-verification.json | awk '{print $1}'
          )"
          node scripts/deploy/write-release-manifest.mjs

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-evidence-${{ env.SOURCE_SHA }}
          path: |
            sbom.cdx.json
            release-scan.json
            cosign-verification.json
            release-manifest.json
          if-no-files-found: warn
          retention-days: 30
