name: One-time dependency lock repair

on:
  push:
    branches:
      - feat/website-modern-shell
    paths:
      - package.json
      - .github/workflows/dependency-lock-repair.yml

permissions:
  contents: write

concurrency:
  group: dependency-lock-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v5
        with:
          ref: feat/website-modern-shell
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Regenerate the lockfile from the reviewed manifest
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify the production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Ensure the manifest was not rewritten
        run: git diff --exit-code -- package.json

      - name: Commit the repaired lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already matches package.json'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'fix(deps): regenerate lockfile with patched nanoid'
          git push origin HEAD:feat/website-modern-shell
