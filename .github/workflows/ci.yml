name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:deployment
      - run: npm run build
        env:
          VITE_API_ENDPOINT: https://api.example.com
      - run: npm run test:seo
      - run: npm run test:performance
      - run: npm run audit:production

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: codestra-frontend:test
          build-args: VITE_API_ENDPOINT=https://api.example.com
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: codestra-frontend:test
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
