name: Web quality

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'config/**'
      - 'index.html'
      - 'nginx.conf'
      - 'package.json'
      - 'package-lock.json'
      - 'lighthouserc.json'
      - '.github/workflows/web-quality.yml'
  push:
    branches:
      - 'feat/website-modern-shell'
      - 'feat/ai-seo-landing-pages'
      - 'feat/odoo-lead-integration'

permissions:
  contents: read

concurrency:
  group: web-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-quality:
    name: Build, test, SEO and asset budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build and static route generation
        run: npm run build
        env:
          SITE_URL: https://codestra.co

      - name: Validate landing-page SEO
        run: npm run test:seo

      - name: Validate initial asset budgets
        run: npm run test:performance

      - name: Validate production dependencies
        run: npm run audit:production

      - name: Upload deterministic quality reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-quality-reports
          path: |
            dist/seo-manifest.json
            dist/performance-budget.json
          if-no-files-found: warn

  lighthouse:
    name: Lighthouse quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: deterministic-quality

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build crawlable production output
        run: npm run build
        env:
          SITE_URL: https://codestra.co

      - name: Run Lighthouse CI
        id: lighthouse
        run: |
          set -o pipefail
          npx --yes @lhci/cli@0.15.1 autorun --config=./lighthouserc.json 2>&1 | tee /tmp/codestra-lighthouse.log

      - name: Publish Lighthouse diagnostics
        if: always()
        run: node scripts/ci/summarize-web-check.mjs lighthouse ${{ steps.lighthouse.outcome }}

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lighthouse-reports
          path: .lighthouseci
          if-no-files-found: warn
