name: GHCR read-only preflight policy

on:
  pull_request:
    paths:
      - '.github/workflows/ghcr-readonly-preflight.yml'
      - '.github/workflows/ghcr-readonly-preflight-static.yml'
      - 'scripts/registry/ghcr-readonly-preflight.sh'
      - 'scripts/ci/check-ghcr-readonly-preflight.mjs'
      - 'scripts/ci/test-ghcr-readonly-preflight-fixture.sh'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ghcr-readonly-preflight.yml'
      - '.github/workflows/ghcr-readonly-preflight-static.yml'
      - 'scripts/registry/ghcr-readonly-preflight.sh'
      - 'scripts/ci/check-ghcr-readonly-preflight.mjs'
      - 'scripts/ci/test-ghcr-readonly-preflight-fixture.sh'

permissions:
  contents: read

concurrency:
  group: ghcr-readonly-preflight-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'

      - name: Validate shell syntax
        run: |
          bash -n scripts/registry/ghcr-readonly-preflight.sh
          bash -n scripts/ci/test-ghcr-readonly-preflight-fixture.sh

      - name: Enforce read-only registry policy
        run: node scripts/ci/check-ghcr-readonly-preflight.mjs

      - name: Exercise descriptor-only fixtures
        run: bash scripts/ci/test-ghcr-readonly-preflight-fixture.sh
