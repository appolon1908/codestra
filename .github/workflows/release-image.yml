name: Release immutable image

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character SHA already merged into main
        required: true
        type: string
      publish:
        description: Publish the verified image to GHCR
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-image-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.verify.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: verify
        name: Verify protected source identity
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "Release workflow must be dispatched from main." >&2
            exit 1
          }
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || {
            echo "source_sha must be a full lowercase SHA." >&2
            exit 1
          }
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          resolved="$(git rev-parse "${SOURCE_SHA}^{commit}")"
          [[ "$resolved" == "$SOURCE_SHA" ]] || exit 1
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          [[ "$(git rev-parse origin/main)" == "$SOURCE_SHA" ]] || {
            echo "Only the exact current main head may be released." >&2
            exit 1
          }
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  build:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      SOURCE_SHA: ${{ needs.source.outputs.source_sha }}
      VITE_API_ENDPOINT: ${{ vars.VITE_API_ENDPOINT }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Validate public build endpoint
        run: |
          set -Eeuo pipefail
          [[ "$VITE_API_ENDPOINT" =~ ^https://[A-Za-z0-9.-]+(:[0-9]{2,5})?(/.*)?$ ]] || {
            echo "VITE_API_ENDPOINT must be a public HTTPS URL." >&2
            exit 1
          }

      - run: npm ci
      - run: npm run verify

      - uses: docker/setup-buildx-action@v3

      - id: image
        name: Set image identity
        run: |
          set -Eeuo pipefail
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          image_tag="${image_name}:sha-${SOURCE_SHA:0:12}"
          echo "name=$image_name" >> "$GITHUB_OUTPUT"
          echo "tag=$image_tag" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.image.outputs.tag }}
          build-args: VITE_API_ENDPOINT=${{ env.VITE_API_ENDPOINT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.image.outputs.tag }}
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: "0"

      - name: Generate vulnerability evidence
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.image.outputs.tag }}
          format: json
          output: release-scan.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Enforce vulnerability gate
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.image.outputs.tag }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GHCR
        if: ${{ inputs.publish }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: publish
        name: Publish and resolve immutable digest
        if: ${{ inputs.publish }}
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          set -Eeuo pipefail
          docker push "$IMAGE_TAG"
          image_ref="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE_TAG")"
          [[ "$image_ref" =~ ^ghcr\.io/[a-z0-9_.-]+/[a-z0-9_.-]+@sha256:[a-f0-9]{64}$ ]] || {
            echo "Registry did not return an immutable digest." >&2
            exit 1
          }
          image_name="${image_ref%@*}"
          image_digest="${image_ref#*@}"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
          echo "image_name=$image_name" >> "$GITHUB_OUTPUT"
          echo "image_digest=$image_digest" >> "$GITHUB_OUTPUT"

      - name: Write signed release tuple
        if: ${{ inputs.publish }}
        env:
          IMAGE_REF: ${{ steps.publish.outputs.image_ref }}
        run: |
          set -Eeuo pipefail
          export SBOM_SHA256="$(sha256sum sbom.cdx.json | awk '{print $1}')"
          export SCAN_SHA256="$(sha256sum release-scan.json | awk '{print $1}')"
          node scripts/deploy/write-release-manifest.mjs

      - name: Attest build provenance
        if: ${{ inputs.publish }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.publish.outputs.image_name }}
          subject-digest: ${{ steps.publish.outputs.image_digest }}
          push-to-registry: true

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ env.SOURCE_SHA }}
          path: |
            sbom.cdx.json
            release-scan.json
            release-manifest.json
          if-no-files-found: warn
          retention-days: 30
