name: Lead intake quality

on:
  pull_request:
    paths:
      - 'src/features/lead-intake/**'
      - 'src/features/routes/odooLeadRoute.tsx'
      - 'services/lead-intake-adapter/**'
      - 'infra/caddy/Caddyfile.lead-intake'
      - 'infra/kong/lead-intake.kong.yml'
      - 'infra/docker/docker-compose.lead-intake.yml'
      - 'openapi/lead-intake.yaml'
      - '.env.odoo.example'
      - '.github/workflows/lead-intake-quality.yml'
  push:
    branches:
      - 'feat/odoo-lead-integration'

permissions:
  contents: read

concurrency:
  group: lead-intake-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-contract:
    name: Website lead client
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Run lead client tests
        run: npm test -- src/features/lead-intake/leadClient.test.ts

      - name: Compile production website
        run: npm run build
        env:
          SITE_URL: https://codestra.co
          VITE_LEAD_CAPTURE_ENDPOINT: /api/leads/v1/consultations
          VITE_ODOO_CAMPAIGN_CODE: CODESTRA-WEB-AI

      - name: Validate generated SEO routes
        run: npm run test:seo

      - name: Validate initial asset budgets
        run: npm run test:performance

  adapter-contract:
    name: Private Odoo adapter
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: codestra_leads_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d codestra_leads_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: services/lead-intake-adapter

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/codestra_leads_test

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/lead-intake-adapter/pyproject.toml

      - name: Install adapter and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Static checks
        run: |
          ruff check app tests scripts
          python -m compileall -q app tests scripts

      - name: Apply database migrations
        run: |
          test "$TEST_DATABASE_URL" = "postgresql://postgres:postgres@127.0.0.1:5432/codestra_leads_test"
          DATABASE_URL="$TEST_DATABASE_URL" python scripts/migrate.py

      - name: Run adapter tests
        run: pytest -q

      - name: Build hardened adapter image
        run: docker build --tag codestra-lead-intake-adapter:test .
